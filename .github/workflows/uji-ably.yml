name: Build Uji Ably (tanpa rilis)

# Workflow khusus uji dua arah headunit <-> PangLink.
# Tidak mempublikasikan release dan tidak memakai nomor build workflow rilis,
# sehingga rilis b150 berikutnya tetap memakai run number 49.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode APK uji (default 149, sama dengan b149 agar bisa menimpa)'
        type: string
        required: false
        default: '149'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Siapkan release keystore
        id: keystore
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diset; APK uji harus ditandatangani dengan kunci rilis."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Validasi keystore & password
        run: |
          set -euo pipefail
          if ! OUT=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1); then
            echo "$OUT"
            echo "::error::Keystore tidak bisa dibuka. Periksa KEYSTORE_BASE64, KEYSTORE_PASSWORD, dan KEY_ALIAS."
            exit 1
          fi
          echo "Keystore valid: alias '$KEY_ALIAS' ditemukan."

      - name: Inject repo OTA otomatis
        run: |
          if [ -f "app/src/main/assets/index.html" ]; then
            sed -i "s|__AUTO_GITHUB_REPO__|${GITHUB_REPOSITORY}|g" app/src/main/assets/index.html
          fi

      - name: Build APK uji
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION_CODE" | grep -Eq '^[0-9]+$'; then
            echo "::error::version_code harus berupa angka."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCodeOverride="$VERSION_CODE" --stacktrace
          mkdir -p dist_apk
          cp app/build/outputs/apk/release/app-release.apk dist_apk/PangDash-Uji-Ably.apk
          ls -lh dist_apk/PangDash-Uji-Ably.apk

      - name: Verifikasi sertifikat APK
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs dist_apk/PangDash-Uji-Ably.apk | tee apk-certs.txt
          grep -qi "certificate SHA-256 digest" apk-certs.txt

      - name: Upload APK uji
        uses: actions/upload-artifact@v4
        with:
          name: PangDash-Uji-Ably-APK
          path: dist_apk/PangDash-Uji-Ably.apk

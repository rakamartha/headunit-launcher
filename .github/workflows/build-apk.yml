name: Build Greycoat Headunit APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          # 1. Jika ada file ZIP yang diupload utuh, ekstrak otomatis
          LATEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$LATEST_ZIP" ]; then
            unzip -o "$LATEST_ZIP" -d .
          fi

          # 2. Hanya pindah folder jika di root tidak ada settings.gradle.kts
          if [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(ls -dt Greycoat-Headunit-Launcher-APK-Project* 2>/dev/null | grep -v "\.zip$" | head -n 1 || true)
            if [ -n "$SUBDIR" ] && [ -d "$SUBDIR" ]; then
              cd "$SUBDIR"
            fi
          fi

          # 3. Pastikan gradle.properties selalu tersedia
          if [ ! -f "gradle.properties" ]; then
            printf "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\nandroid.nonTransitiveRClass=true\n" > gradle.properties
          fi

          # 4. Buat otomatis MediaListenerService.kt jika belum terupload
          mkdir -p app/src/main/java/com/greycoat/launcher
          if grep -q "class MediaListenerService" app/src/main/java/com/greycoat/launcher/MainActivity.kt 2>/dev/null; then
            rm -f app/src/main/java/com/greycoat/launcher/MediaListenerService.kt
          elif grep -q "MediaListenerService" app/src/main/java/com/greycoat/launcher/MainActivity.kt 2>/dev/null && [ ! -f "app/src/main/java/com/greycoat/launcher/MediaListenerService.kt" ]; then
            echo "" | base64 -d > app/src/main/java/com/greycoat/launcher/MediaListenerService.kt
          fi

          gradle assembleDebug --stacktrace

          mkdir -p "$GITHUB_WORKSPACE/dist_apk"
          APK_OUT=$(find . -name "app-debug.apk" | head -n 1)
          cp "$APK_OUT" "$GITHUB_WORKSPACE/dist_apk/Greycoat-Headunit-Launcher.apk"

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Greycoat-Headunit-Launcher-APK
          path: dist_apk/Greycoat-Headunit-Launcher.apk

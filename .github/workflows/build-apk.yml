name: Build Greycoat Headunit APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          PROJECT_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p dist_apk
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          cp "$APK_PATH" dist_apk/Greycoat-Headunit-Launcher.apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Greycoat-Headunit-Launcher-APK
          path: dist_apk/Greycoat-Headunit-Launcher.apk

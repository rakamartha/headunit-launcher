name: Build & Publish PangDash OTA APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK & Inject Automatic OTA Repo
        run: |
          LATEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$LATEST_ZIP" ]; then
            unzip -o "$LATEST_ZIP" -d .
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(ls -dt *Headunit-Launcher-APK-Project* 2>/dev/null | grep -v "\.zip$" | head -n 1 || true)
            if [ -n "$SUBDIR" ] && [ -d "$SUBDIR" ]; then
              cd "$SUBDIR"
            fi
          fi

          # Tanamkan nama repositori GitHub Anda secara otomatis ke dalam APK agar tidak perlu ketik manual di Headunit
          if [ -f "app/src/main/assets/index.html" ]; then
            sed -i "s|__AUTO_GITHUB_REPO__|${GITHUB_REPOSITORY}|g" app/src/main/assets/index.html
          fi

          if [ ! -f "gradle.properties" ]; then
            printf "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\nandroid.nonTransitiveRClass=true\n" > gradle.properties
          fi

          if grep -q "class MediaListenerService" app/src/main/java/com/greycoat/launcher/MainActivity.kt 2>/dev/null; then
            rm -f app/src/main/java/com/greycoat/launcher/MediaListenerService.kt
          fi

          gradle assembleDebug --stacktrace

          mkdir -p "$GITHUB_WORKSPACE/dist_apk"
          APK_OUT=$(find . -name "app-debug.apk" | head -n 1)
          cp "$APK_OUT" "$GITHUB_WORKSPACE/dist_apk/PangDash-Headunit-Launcher.apk"

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PangDash-Headunit-Launcher-APK
          path: dist_apk/PangDash-Headunit-Launcher.apk

      - name: Auto-Publish GitHub Release for 1-Click OTA Update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | cut -d'"' -f2 || echo "4.1.0")
          VER_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | awk '{print $3}' || echo "20")
          TAG_NAME="v${VER_NAME}.${VER_CODE}"

          gh release create "$TAG_NAME" "$GITHUB_WORKSPACE/dist_apk/PangDash-Headunit-Launcher.apk" \
            --title "PangDash $TAG_NAME" \
            --notes "Pembaruan otomatis PangDash Headunit Launcher ($TAG_NAME) - Build #${GITHUB_RUN_NUMBER}" \
            --latest || true

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/PangDash-Headunit-Launcher.apk"
          curl -s -X POST "https://ntfy.sh/pangdash_global_ota_release_v1" \
            -d "{\"version\":\"${VER_NAME}.${VER_CODE}\",\"versionCode\":${VER_CODE},\"apkUrl\":\"${DOWNLOAD_URL}\",\"notes\":\"Pembaruan otomatis PangDash (${TAG_NAME}) siap diinstal.\"}" || true
